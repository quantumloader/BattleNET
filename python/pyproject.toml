[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "battlenet"
version = "2.1.0"
description = "BattlEye RCon client for Python (BattleNET)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "LGPL-3.0-or-later" }
authors = [{ name = "quantumloader" }]
keywords = ["battleye", "rcon", "dayz", "arma"]
dependencies = []

[project.scripts]
battlenet = "battlenet.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["battlenet*"]
