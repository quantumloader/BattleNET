name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Pack
        run: |
          mkdir -p artifacts/libs
          dotnet pack BattleNET.Core/BattleNET.Core.csproj -c Release -o artifacts --nologo
          dotnet pack BattleNET.Commands/BattleNET.Commands.csproj -c Release -o artifacts --nologo
          dotnet pack BattleNET.Cli/BattleNET.Cli.csproj -c Release -o artifacts --nologo

      - name: Build library binaries
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION=$(grep -oP '(?<=<Version>)[^<]+' BattleNET.Core/BattleNET.Core.csproj | head -1)
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

          cp BattleNET.Core/bin/Release/net10.0/BattleNET.Core.dll artifacts/libs/
          cp BattleNET.Core/bin/Release/net10.0/BattleNET.Core.xml artifacts/libs/ || true
          cp BattleNET.Core/bin/Release/net10.0/BattleNET.Core.pdb artifacts/libs/ || true
          cp BattleNET.Commands/bin/Release/net10.0/BattleNET.Commands.dll artifacts/libs/
          cp BattleNET.Commands/bin/Release/net10.0/BattleNET.Commands.xml artifacts/libs/ || true
          cp BattleNET.Commands/bin/Release/net10.0/BattleNET.Commands.pdb artifacts/libs/ || true
          (cd artifacts/libs && zip -r "../BattleNET.Libraries-${VERSION}-net10.0.zip" .)

      - name: Publish CLI zip
        run: |
          dotnet publish BattleNET.Cli/BattleNET.Cli.csproj -c Release -r win-x64 --self-contained false \
            -o artifacts/cli-win-x64 -p:PublishSingleFile=true --nologo
          (cd artifacts/cli-win-x64 && zip -r "../BattleNET-${VERSION}-win-x64.zip" .)

      - name: NuGet login (OIDC)
        uses: NuGet/login@v1
        id: login
        with:
          # nuget.org profile username (not email). Override via repo variable NUGET_USER if different.
          user: ${{ vars.NUGET_USER }}

      - name: Push to nuget.org
        run: |
          dotnet nuget push "artifacts/*.nupkg" \
            --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      - name: Upload release assets
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            "artifacts/BattleNET.Libraries-${VERSION}-net10.0.zip" \
            "artifacts/BattleNET-${VERSION}-win-x64.zip" \
            artifacts/BattleNET.Core.*.nupkg \
            artifacts/BattleNET.Commands.*.nupkg \
            artifacts/BattleNET.Cli.*.nupkg \
            --clobber
